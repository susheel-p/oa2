[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:market_monitor]
command=python scripts/market_monitor.py
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
stderr_logfile=/app/logs/daemon_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile=/app/logs/daemon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=30
environment=PYTHONUNBUFFERED=1

[program:watchdog]
command=python scripts/watchdog.py --loop
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=30
stderr_logfile=/app/logs/watchdog_error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
stdout_logfile=/app/logs/watchdog.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=10
environment=PYTHONUNBUFFERED=1
