# Development override for docker-compose.yml
# Enables hot-reload by bind-mounting entire source code
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  tradingbot-daemon:
    build:
      target: dev
    # Full source code bind mount for live editing (no rebuild needed)
    volumes:
      - .:/app
      - C:\Users\pamed\Susheel\tradingbot-docker\logs:/app/logs
      - C:\Users\pamed\Susheel\tradingbot-docker\reports:/app/reports
      - C:\Users\pamed\Susheel\tradingbot-docker\data\tradingbot:/data/tradingbot
    # Development: use supervisord like production (ensures consistency)
    # For live debugging, use: docker exec tradingbot-daemon tail -f /app/logs/daemon.log
    # or: docker logs -f tradingbot-daemon
    # Less strict restart policy for development
    restart: on-failure
