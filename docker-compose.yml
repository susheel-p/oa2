version: '3.8'

services:
  tradingbot-daemon:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    image: tradingbot-daemon:latest
    container_name: tradingbot-daemon
    restart: unless-stopped

    # Load .env file for broker credentials and other config
    env_file: .env

    # Override/set specific environment variables for Docker
    environment:
      - TZ=America/New_York
      - TRADINGBOT_HOME=/data/tradingbot
      - REPORTS_DIR=/app/reports
      - MOOMOO_OPEND_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1

    # Volume mounts (external directory for Docker artifacts)
    volumes:
      # Logs: bind to C:\Users\pamed\Susheel\tradingbot-docker\logs
      - C:\Users\pamed\Susheel\tradingbot-docker\logs:/app/logs

      # Reports: bind to C:\Users\pamed\Susheel\tradingbot-docker\reports
      - C:\Users\pamed\Susheel\tradingbot-docker\reports:/app/reports

      # Persistent tradingbot data: bind to C:\Users\pamed\Susheel\tradingbot-docker\data\tradingbot
      - C:\Users\pamed\Susheel\tradingbot-docker\data\tradingbot:/data/tradingbot

    # Allow container to reach host's moomoo OpenD (port 11111)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Health check: ensure daemon heartbeat is fresh
    healthcheck:
      test: ["CMD", "test", "-f", "/app/logs/daemon_heartbeat.txt"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

