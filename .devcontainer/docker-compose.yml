version: '3.8'
services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - /workspace/.venv
    environment:
      - PYTHONUNBUFFERED=1
    command: sleep infinity
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    env_file:
      - ../.env

  market-monitor:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m scripts.market_monitor
    depends_on:
      - devcontainer
    env_file:
      - ../.env
    profiles:
      - daemon

  paper-trade:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m scripts.paper_trade
    depends_on:
      - devcontainer
    env_file:
      - ../.env
    profiles:
      - daemon
