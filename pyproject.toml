[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oa2"
version = "0.1.0"
description = "OptionsAgents v2 — adaptive ensemble for index/ETF/mega-cap options"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "httpx>=0.27",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "praw>=7.7",
]

[project.optional-dependencies]
broker = ["moomoo-api>=10.0"]
llm = ["anthropic>=0.34"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["oa2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"